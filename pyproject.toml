[project]
name = "travel-planner-agent"
version = "0.2.0"
description = "Chat trip planner over a local 2026 flight and hotel catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.20.0",
    "pandas>=3.0.5",
    "pydantic>=2.0",
    "prometheus-client>=0.21.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
